<!DOCTYPE html>
<!-- Music Tools. Your name and feedback email go in js/my-settings.js, not here. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Music Tools</title>
<!-- The ?v= on each file below makes browsers fetch fresh copies after an update, instead of mixing
     saved old files with new ones. It changes with every update. -->
<link rel="stylesheet" href="css/base.css?v=20261109-6">
<link rel="stylesheet" href="css/piano.css?v=20261109-6">
<link rel="stylesheet" href="css/tuner.css?v=20261109-6">
<link rel="stylesheet" href="css/footer.css?v=20261109-6">
</head>
<body>
<h1>Music Tools</h1>

<div class="sec-label">Voice ranges</div>
<div class="legend" id="legend"></div>

<div class="piano-scroll" id="pianoScroll">
  <div class="piano-wrap" id="pianoWrap"></div>
</div>
<div class="sound-row">
  <span class="sound-pick">
    <label for="keySound">Keyboard sound</label>
    <select class="ts-select" id="keySound">
      <option value="classic">Classic</option>
      <option value="musicbox">Music box</option>
      <option value="organ">Organ</option>
      <option value="pad">Synth pad</option>
      <option value="lead">Synth lead</option>
      <option value="8bit">8-bit</option>
    </select>
  </span>
  <span class="sound-pick">
    <label for="keyEffect">Effect</label>
    <select class="ts-select" id="keyEffect">
      <option value="none">None</option>
      <optgroup label="Echo and space">
        <option value="reverb">Hall reverb</option>
        <option value="echo">Echo</option>
        <option value="space">Space echo</option>
      </optgroup>
      <optgroup label="Swirl">
        <option value="chorus">Chorus</option>
        <option value="phaser">Phaser</option>
        <option value="flanger">Flanger</option>
        <option value="spin">Rotary spin</option>
      </optgroup>
      <optgroup label="Mystical">
        <option value="shimmer">Shimmer</option>
        <option value="dream">Dream</option>
      </optgroup>
    </select>
  </span>
</div>
<p class="kbd-hint" id="kbdHint" hidden>On a computer keyboard, A W S E D F T G Y H U J K play the notes from <span id="kbdFrom">C4</span>. Z and X move down or up an octave.</p>

<!-- Each section's heading folds it away; js/sections.js -->
<section class="card fold" data-fold="staff">
  <h2 class="sec-head"><button type="button" class="sec-toggle" aria-expanded="true" aria-controls="body-staff"><span class="sec-label">Grand staff</span><span class="sec-status"></span><svg class="sec-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></h2>
  <div class="sec-body" id="body-staff">
    <div class="current-note" id="currentNoteDisp">—</div>
    <canvas id="staffCanvas"></canvas>
  </div>
</section>

<section class="card fold" data-fold="tuner" id="tuner">
  <h2 class="sec-head"><button type="button" class="sec-toggle" aria-expanded="true" aria-controls="body-tuner"><span class="sec-label">Tuner</span><span class="sec-status"></span><svg class="sec-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></h2>
  <div class="sec-body" id="body-tuner">
    <div class="tn-row">
      <button class="play-btn" id="tnBtn" type="button"><span aria-hidden="true">🎤</span> Start listening</button>
      <p class="tn-status" id="tnStatus" role="status"></p>
    </div>
    <div class="tn-display">
      <div class="tn-readout">
        <span class="tn-note" id="tnNote">—</span>
        <span class="tn-freq" id="tnFreq"></span>
      </div>
      <div class="tn-gauge" aria-hidden="true">
        <div class="tn-meter"><div class="tn-zone"></div><div class="tn-mid"></div><div class="tn-needle" id="tnNeedle"></div></div>
        <div class="tn-scale"><span>&#9837; Flat</span><span>Sharp &#9839;</span></div>
      </div>
    </div>
    <p class="tn-verdict" id="tnVerdict"></p>
  </div>
</section>

<section class="card fold" data-fold="metronome">
  <h2 class="sec-head"><button type="button" class="sec-toggle" aria-expanded="true" aria-controls="body-metronome"><span class="sec-label">Metronome</span><span class="sec-status"></span><svg class="sec-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></h2>
  <div class="sec-body" id="body-metronome">
    <div class="metro-row">
      <div class="metro-main">
        <button class="play-btn" id="playBtn" type="button" onclick="toggleMetro()">&#9654; Start</button>
        <button class="play-btn tap-btn" id="tapBtn" type="button" onclick="tapTempo()" aria-label="Tap tempo: tap along with the beat">Tap</button>
        <select class="ts-select" id="tsSelect" onchange="updateTs()" aria-label="Time signature">
          <option value="1">Steady</option>
          <option value="2">2/4</option>
          <option value="3">3/4</option>
          <option value="4" selected>4/4</option>
          <option value="6">6/8</option>
        </select>
        <div class="beats-row" id="beatsRow"></div>
      </div>
      <div class="metro-tempo">
        <button class="adj-btn" type="button" onclick="adjBpm(-1)" aria-label="Slower">&#8722;</button>
        <div class="bpm-readout"><span class="bpm-num" id="bpmVal">80</span><span class="bpm-lbl">bpm</span></div>
        <input type="range" class="bpm-slider" min="40" max="208" value="80" step="1" id="bpmSlider" oninput="setBpm(parseInt(this.value))" aria-label="Tempo">
        <button class="adj-btn" type="button" onclick="adjBpm(1)" aria-label="Faster">+</button>
      </div>
      <div class="metro-sound">
        <label class="metro-sound-label" for="clickSound">Sound</label>
        <select class="ts-select" id="clickSound">
          <optgroup label="Gentle">
            <option value="tick">Soft tick</option>
            <option value="felt">Felt knock</option>
            <option value="drop">Water drop</option>
          </optgroup>
          <optgroup label="Percussion">
            <option value="wood">Wood block</option>
            <option value="claves">Claves</option>
            <option value="hihat">Hi-hat</option>
            <option value="drums">Drum kit</option>
          </optgroup>
          <optgroup label="Musical">
            <option value="keys">Match keyboard</option>
            <option value="bell">Bell</option>
            <option value="8bit">8-bit</option>
          </optgroup>
          <optgroup label="Original">
            <option value="classic">Classic beep</option>
          </optgroup>
        </select>
        <div class="vol-group">
          <label class="vol-icon" for="clickVolume">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 9.5a4 4 0 0 1 0 5"/></svg>
            <span class="vh">Metronome volume</span>
          </label>
          <input type="range" class="vol-slider" id="clickVolume" min="0" max="100" step="5" value="70">
        </div>
      </div>
    </div>
  </div>
</section>

<section class="card fold" data-fold="timer">
  <h2 class="sec-head"><button type="button" class="sec-toggle" aria-expanded="true" aria-controls="body-timer"><span class="sec-label">Timer</span><span class="sec-status"></span><svg class="sec-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></h2>
  <div class="sec-body" id="body-timer">
    <div class="tm-modes" role="group" aria-label="Timer type">
      <button type="button" class="tm-mode" id="tmModeSw" aria-pressed="true" onclick="timerMode('sw')">Stopwatch</button>
      <button type="button" class="tm-mode" id="tmModeCd" aria-pressed="false" onclick="timerMode('cd')">Countdown</button>
    </div>
    <div id="swPanel">
      <div class="sw-display" id="swDisplay">00:00.00</div>
      <div class="sw-row">
        <button class="sw-btn" id="swLapBtn" type="button" onclick="swLapOrReset()" disabled>Lap</button>
        <button class="sw-btn" id="swStartBtn" type="button" onclick="swToggle()">Start</button>
      </div>
      <ol class="sw-laps" id="swLaps"></ol>
    </div>
    <div id="cdPanel" hidden>
      <div class="cd-set">
        <button class="adj-btn" type="button" id="cdMinus" onclick="cdAdjust(-1)" aria-label="One minute less">&#8722;</button>
        <div class="sw-display cd-display" id="cdDisplay" role="timer">05:00</div>
        <button class="adj-btn" type="button" id="cdPlus" onclick="cdAdjust(1)" aria-label="One minute more">+</button>
      </div>
      <div class="sw-row">
        <button class="sw-btn" id="cdResetBtn" type="button" onclick="cdReset()" disabled>Reset</button>
        <button class="sw-btn" id="cdStartBtn" type="button" onclick="cdToggle()">Start</button>
      </div>
      <p class="cd-msg" id="cdMsg" role="status"></p>
    </div>
  </div>
</section>

<!-- On every page: the feedback link and the copyright line. The name comes from js/my-settings.js. -->
<footer class="lf-mark lf-foot" id="lf-foot">
  <a class="lf-fb-link" href="feedback.html"><span aria-hidden="true">💬</span> Send feedback</a>
  <p class="lf-copy" id="lf-copy">© 2026</p>
  <svg class="lf-logo" viewBox="0 0 38 32" aria-hidden="true">
    <path class="lf-logo-c" d="M15.5 6.64A7 7 0 1 0 15.5 17.36M31.5 6.64A7 7 0 1 0 31.5 17.36"/>
    <path class="lf-logo-smile" d="M4.5 23Q18 33 31.5 23"/>
  </svg>
</footer>

<!-- your name and feedback email; loaded first so the footer can use them -->
<script src="js/my-settings.js?v=20261109-6"></script>
<script src="js/footer.js?v=20261109-6"></script>
<!-- the sound engine, the screen-awake helper and the folding sections come first: the tools below use them -->
<script src="js/sound.js?v=20261109-6"></script>
<script src="js/effects.js?v=20261109-6"></script>
<script src="js/awake.js?v=20261109-6"></script>
<script src="js/sections.js?v=20261109-6"></script>
<!-- one script per tool; the keyboard comes before the others because they use its note helpers -->
<script src="js/piano.js?v=20261109-6"></script>
<script src="js/staff.js?v=20261109-6"></script>
<script src="js/pitch.js?v=20261109-6"></script>
<script src="js/tuner.js?v=20261109-6"></script>
<script src="js/metronome.js?v=20261109-6"></script>
<script src="js/stopwatch.js?v=20261109-6"></script>
<!-- the keyboard and metronome sound menus; after the tools they change -->
<script src="js/sound-options.js?v=20261109-6"></script>
</body>
</html>
